<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proxy Sentinel · 仪表盘</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #1e293b; }
  header h1 { font-size: 16px; margin: 0; }
  nav a { color: #94a3b8; text-decoration: none; margin-left: 18px; font-size: 14px; }
  nav a:hover, nav a.active { color: #e2e8f0; }
  main { padding: 24px; }
  .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .card { background: #1e293b; border-radius: 12px; padding: 20px; }
  .card .label { color: #94a3b8; font-size: 12px; }
  .card .value { font-size: 28px; font-weight: 700; margin-top: 8px; }
  section { background: #1e293b; border-radius: 12px; padding: 20px; margin-top: 24px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 500; }
  .pill { padding: 2px 8px; border-radius: 999px; font-size: 12px; }
  .ok { background: #064e3b; color: #6ee7b7; }
  .err { background: #7f1d1d; color: #fca5a5; }
</style>
</head>
<body>
<header>
  <h1>Proxy Sentinel 仪表盘</h1>
  <nav>
    <a href="/dashboard" class="active">仪表盘</a>
    <a href="/logs">日志</a>
    <a href="/flow">流向</a>
    <a href="#" id="logout">登出</a>
  </nav>
</header>
<main>
  <div class="cards" id="cards"></div>
  <section>
    <h3>热点路径 Top 10</h3>
    <table>
      <thead><tr><th>路径</th><th>请求数</th></tr></thead>
      <tbody id="paths"></tbody>
    </table>
  </section>
  <section>
    <h3>状态码分布</h3>
    <table>
      <thead><tr><th>状态类</th><th>数量</th></tr></thead>
      <tbody id="status"></tbody>
    </table>
  </section>
</main>
<script>
const fmt = n => Number(n).toLocaleString();
async function load() {
  try {
    const [r, t] = await Promise.all([
      fetch('/api/stats/realtime').then(r => r.json()),
      fetch('/api/stats/trend?window=24h').then(r => r.json()),
    ]);
    document.getElementById('cards').innerHTML = [
      ['当前 QPS', r.last_minute_qps.toFixed(2)],
      ['错误率', r.error_rate.toFixed(2) + '%'],
      ['平均耗时', r.avg_duration.toFixed(0) + ' ms'],
      ['今日请求', fmt(r.today_total)],
    ].map(([l, v]) => `<div class="card"><div class="label">${l}</div><div class="value">${v}</div></div>`).join('');
    document.getElementById('paths').innerHTML = (t.top_paths || []).map(p => `<tr><td>${p.path}</td><td>${fmt(p.count)}</td></tr>`).join('');
    document.getElementById('status').innerHTML = (t.status_distribution || []).map(s => `<tr><td><span class="pill ${s.class==='5xx'?'err':'ok'}">${s.class}</span></td><td>${fmt(s.count)}</td></tr>`).join('');
  } catch (e) { console.error(e); }
}
document.getElementById('logout').addEventListener('click', async (e) => {
  e.preventDefault();
  await fetch('/api/auth/logout', { method: 'POST' });
  window.location.href = '/login';
});
load();
setInterval(load, 5000);
</script>
</body>
</html>
