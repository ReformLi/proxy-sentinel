<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proxy Sentinel · 日志查询</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #1e293b; }
  header h1 { font-size: 16px; margin: 0; }
  nav a { color: #94a3b8; text-decoration: none; margin-left: 18px; font-size: 14px; }
  nav a:hover, nav a.active { color: #e2e8f0; }
  main { padding: 24px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  input, select, button { padding: 8px 10px; background: #1e293b; border: 1px solid #334155; border-radius: 6px; color: #e2e8f0; font-size: 13px; }
  button { cursor: pointer; background: #3b82f6; border-color: #3b82f6; color: #fff; }
  button:hover { background: #2563eb; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; background: #1e293b; border-radius: 8px; overflow: hidden; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; font-weight: 500; }
  .pager { margin-top: 16px; display: flex; gap: 8px; align-items: center; }
  pre { background: #0f172a; padding: 12px; border-radius: 6px; overflow: auto; font-size: 12px; }
</style>
</head>
<body>
<header>
  <h1>日志查询</h1>
  <nav>
    <a href="/dashboard">仪表盘</a>
    <a href="/logs" class="active">日志</a>
    <a href="/flow">流向</a>
    <a href="#" id="logout">登出</a>
  </nav>
</header>
<main>
  <div class="filters">
    <select id="method"><option value="">全部方法</option><option>GET</option><option>POST</option><option>PUT</option><option>DELETE</option><option>PATCH</option></select>
    <input id="path" placeholder="路径关键词" />
    <input id="keyword" placeholder="Body 搜索" />
    <input id="status_min" type="number" placeholder="状态码 ≥" style="width:120px" />
    <button id="search">查询</button>
    <button id="export" style="background:#10b981;border-color:#10b981">导出 CSV</button>
  </div>
  <table>
    <thead><tr><th>ID</th><th>方法</th><th>路径</th><th>状态</th><th>耗时(ms)</th><th>后端</th><th>时间</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
  <div class="pager">
    <button id="prev">上一页</button>
    <span id="info"></span>
    <button id="next">下一页</button>
  </div>
  <pre id="detail" style="display:none"></pre>
</main>
<script>
let page = 1;
const qs = id => document.getElementById(id).value;
function params() {
  const p = new URLSearchParams();
  p.set('page', page);
  p.set('page_size', 50);
  if (qs('method')) p.set('method', qs('method'));
  if (qs('path')) p.set('path', qs('path'));
  if (qs('keyword')) p.set('keyword', qs('keyword'));
  if (qs('status_min')) p.set('status_min', qs('status_min'));
  return p;
}
async function load() {
  const data = await fetch('/api/logs?' + params()).then(r => r.json());
  document.getElementById('info').textContent = `第 ${data.page} 页 / 共 ${Math.ceil(data.total / data.page_size)} 页（${data.total} 条）`;
  document.getElementById('rows').innerHTML = (data.data || []).map(l =>
    `<tr style="cursor:pointer" data-id="${l.id}"><td>${l.id}</td><td>${l.method}</td><td>${l.path}</td><td>${l.status}</td><td>${l.duration}</td><td>${l.backend_url||''}</td><td>${new Date(l.created_at).toLocaleString()}</td></tr>`
  ).join('');
  document.querySelectorAll('tr[data-id]').forEach(tr => tr.onclick = async () => {
    const d = await fetch('/api/logs/' + tr.dataset.id).then(r => r.json());
    const el = document.getElementById('detail');
    el.style.display = 'block';
    el.textContent = JSON.stringify(d, null, 2);
  });
}
document.getElementById('search').onclick = () => { page = 1; load(); };
document.getElementById('prev').onclick = () => { if (page > 1) { page--; load(); } };
document.getElementById('next').onclick = () => { page++; load(); };
document.getElementById('export').onclick = () => { window.location.href = '/api/logs/export?' + params(); };
document.getElementById('logout').onclick = async (e) => { e.preventDefault(); await fetch('/api/auth/logout', { method: 'POST' }); location.href = '/login'; };
load();
</script>
</body>
</html>
