<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proxy Sentinel · 登录</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    background: #0f172a; color: #e2e8f0;
  }
  .card {
    width: 100%; max-width: 360px; padding: 32px; background: #1e293b; border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0,0,0,.45);
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 24px; font-size: 13px; }
  label { display: block; font-size: 13px; margin: 16px 0 6px; color: #cbd5e1; }
  input {
    width: 100%; padding: 10px 12px; border: 1px solid #334155; border-radius: 8px;
    background: #0f172a; color: #e2e8f0; font-size: 14px;
  }
  input:focus { outline: none; border-color: #3b82f6; }
  button {
    width: 100%; margin-top: 24px; padding: 11px; border: 0; border-radius: 8px;
    background: #3b82f6; color: #fff; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  button:hover { background: #2563eb; }
  .msg { margin-top: 14px; font-size: 13px; min-height: 18px; color: #f87171; }
</style>
</head>
<body>
  <form class="card" id="loginForm">
    <h1>Proxy Sentinel</h1>
    <p class="sub">代理网关与日志分析平台</p>
    <label for="username">用户名</label>
    <input id="username" name="username" autocomplete="username" required />
    <label for="password">密码</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required />
    <button type="submit">登录</button>
    <div class="msg" id="msg"></div>
  </form>
  <script>
    const form = document.getElementById('loginForm');
    const msg = document.getElementById('msg');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.textContent = '';
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      try {
        const resp = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });
        if (resp.ok) { window.location.href = '/dashboard'; }
        else {
          const data = await resp.json().catch(() => ({ error: '登录失败' }));
          msg.textContent = data.error || '登录失败';
        }
      } catch (err) { msg.textContent = '网络错误'; }
    });
  </script>
</body>
</html>
