<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Proxy Sentinel · 数据流向</title>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif; background: #0f172a; color: #e2e8f0; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; border-bottom: 1px solid #1e293b; }
  header h1 { font-size: 16px; margin: 0; }
  nav a { color: #94a3b8; text-decoration: none; margin-left: 18px; font-size: 14px; }
  nav a:hover, nav a.active { color: #e2e8f0; }
  main { padding: 24px; }
  .flow { display: flex; align-items: center; gap: 0; flex-wrap: wrap; }
  .node { background: #1e293b; border-radius: 12px; padding: 16px 20px; min-width: 140px; text-align: center; }
  .node .n { font-weight: 700; }
  .node .v { color: #94a3b8; font-size: 12px; margin-top: 6px; }
  .edge { padding: 0 18px; color: #3b82f6; font-size: 12px; }
  table { width: 100%; border-collapse: collapse; background: #1e293b; border-radius: 8px; overflow: hidden; margin-top: 24px; font-size: 13px; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid #334155; }
  th { color: #94a3b8; }
</style>
</head>
<body>
<header>
  <h1>数据流向</h1>
  <nav>
    <a href="/dashboard">仪表盘</a>
    <a href="/logs">日志</a>
    <a href="/flow" class="active">流向</a>
    <a href="#" id="logout">登出</a>
  </nav>
</header>
<main>
  <div class="flow" id="flow"></div>
  <table>
    <thead><tr><th>后端</th><th>请求数</th><th>平均耗时(ms)</th><th>错误数</th></tr></thead>
    <tbody id="rows"></tbody>
  </table>
</main>
<script>
const fmt = n => Number(n).toLocaleString();
async function load() {
  const data = await fetch('/api/stats/flow?window=24h').then(r => r.json());
  const total = (data || []).reduce((s, n) => s + n.count, 0);
  document.getElementById('flow').innerHTML =
    `<div class="node"><div class="n">客户端</div><div class="v">${fmt(total)} 请求</div></div>` +
    `<div class="edge">→</div>` +
    `<div class="node"><div class="n">代理网关</div><div class="v">Sentinel</div></div>` +
    `<div class="edge">→</div>` +
    `<div class="node"><div class="n">后端集群</div><div class="v">${(data || []).length} 节点</div></div>`;
  document.getElementById('rows').innerHTML = (data || []).map(n =>
    `<tr><td>${n.backend_url}</td><td>${fmt(n.count)}</td><td>${n.avg_duration.toFixed(0)}</td><td>${fmt(n.error_count)}</td></tr>`
  ).join('');
}
document.getElementById('logout').onclick = async (e) => { e.preventDefault(); await fetch('/api/auth/logout', { method: 'POST' }); location.href = '/login'; };
load();
</script>
</body>
</html>
