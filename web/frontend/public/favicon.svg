<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>
  </defs>
  <!-- 盾牌外形：哨兵/防护 -->
  <path d="M16 2 L28 6 V15 C28 22 23 28 16 30 C9 28 4 22 4 15 V6 Z" fill="url(#shield)" stroke="#033b2a" stroke-width="0.8"/>
  <!-- 中心网关节点 -->
  <circle cx="16" cy="15" r="3" fill="#ffffff"/>
  <!-- 连线：流量分发到后端 -->
  <line x1="16" y1="15" x2="10" y2="9" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="15" x2="22" y2="9" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <line x1="16" y1="15" x2="16" y2="23" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round"/>
  <!-- 后端节点 -->
  <circle cx="10" cy="9" r="2" fill="#ffffff"/>
  <circle cx="22" cy="9" r="2" fill="#ffffff"/>
  <circle cx="16" cy="23" r="2" fill="#ffffff"/>
</svg>
